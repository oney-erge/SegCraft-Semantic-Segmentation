name: Feature request
description: Suggest something SegCraft should do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem first, then the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like SegCraft to do?
      description: SegCraft keeps the CLI, Python API, and web app on one configuration. If it needs a new setting, say where it would live.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Existing presets, configuration, or other tools.
